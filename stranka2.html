<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Můj IT Web - Registrace</title>
  <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.css">
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.min.css">
  <link rel="stylesheet" href="node_modules/bootswatch/dist/vapor/bootstrap.min.css">
</head>

<body class="bg-info-subtle">

  <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="fa-solid fa-laptop-code me-2"></i>Můj IT Projekt
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigace">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navigace">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Domů</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold text-decoration-underline" href="stranka2.html">Registrace do kurzu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="stranka3.html">Kontakt</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="card p-3 border-2 border-primary">
      <h2 class="text-danger mb-3"><i class="fw-bold fa-adress-card fa-solid fa-pen-to-square me-2"></i>Registrace do IT Kurzů</h2>

      <form action="#" method="POST">
        <div class="mb-3">
          <label for="jmeno" class=" form-label fw-bold">Zadejte vaše jméno:</label>
          <input type="text" class="form-control" id="jmeno" placeholder="Pepa Novák" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-bold">Váš Email:</label>
          <input type="email" class="form-control" id="email" placeholder="pepa@seznam.cz" required>
        </div>

     
        <div class="mb-3">
          <label for="vyberKurzu" class="form-label fw-bold mb-3">Vyberte kurz nebo více kurzů:</label>
          <select id="vyberKurzu" name="kurzy[]" multiple placeholder="Vyber kurzu..." autocomplete="off">
            <option value="" disabled selected>Vyberte...</option>
            <option value="html">Základy HTML a CSS</option>
            <option value="js">JavaScript pro začátečníky</option>
            <option value="python">Programování v Pythonu</option>
            <option value="hardware">Stavba PC a Hardware</option>
          </select>
          <div class="form-text text-danger">Musíte vybrat odpověď!!!</div>
        </div>

        <button type="submit" class="btn btn-success btn-lg">Odeslat registraci</button>
      </form>
    </div>
  </div>

  <footer class="bg-dark text-light text-center py-3 mt-auto">
    <p class="mb-1">Školní projekt z IT - 2. ročník</p>
    <a href="dokumentace.pdf" target="_blank" class="text-warning text-decoration-none fw-bold">
      <i class="fa-solid fa-file-pdf me-1"></i>Odkaz na dokumentaci :)
    </a>
  </footer>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="node_modules/tom-select/dist/js/tom-select.complete.js"></script>
  <script>
    new TomSelect("#vyberKurzu", {
      maxItems: 4
    });
  </script>
</body>

</html>
